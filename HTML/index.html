<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart To-Do Dashboard</title>
    <!-- We'll add our CSS link here later -->
</head>
<body>

    <main class="todo-container">
        <header>
            <h1>Smart To-Do Dashboard</h1>
            <p>Track, filter, and manage your daily engineering tasks.</p>
        </header>

        <!-- Input Section -->
        <section class="input-section">
            <input type="text" id="task-input" placeholder="Add a new task..." autocomplete="off">
            <button id="add-task-btn">Add Task</button>
        </section>

        <!-- Task List Container -->
        <section class="list-section">
            <ul id="task-list">
                <!-- JavaScript will inject tasks dynamically here -->
            </ul>
        </section>
    </main>

    <!-- Connect our JavaScript logic -->
    <script src="app.js"></script>
</body>
</html>
